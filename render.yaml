services:
  - type: web
    name: bayesline
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "8000"
      - key: BAYESLINE_DEBUG
        value: "false"
      - key: BAYESLINE_ANTHROPIC_API_KEY
        sync: false
      - key: BAYESLINE_NEWSAPI_KEY
        sync: false
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - Dockerfile
